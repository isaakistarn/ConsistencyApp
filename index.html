<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Reminders, time blocking and consistency tracking" />
    <meta name="theme-color" content="#1e1822" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f9f5ed" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Consistency" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Consistency</title>
    <script>
      // GitHub Pages SPA redirect (pair of 404.html): restore the original deep link.
      ;(function () {
        var redirect = sessionStorage.getItem('spa:redirect')
        if (redirect) {
          sessionStorage.removeItem('spa:redirect')
          history.replaceState(null, '', redirect)
        }
      })()
      // Apply persisted theme before first paint to avoid a flash.
      ;(function () {
        try {
          var raw = localStorage.getItem('consistency:ui')
          var theme = raw ? JSON.parse(raw).state.theme : 'system'
          var dark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
